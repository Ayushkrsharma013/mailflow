<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 32" fill="none">
  <!-- Envelope body -->
  <rect x="4" y="6" width="22" height="15" rx="2.5" stroke="#00D4FF" stroke-width="1.2" fill="#00D4FF" fill-opacity="0.15"/>
  <!-- Envelope flap -->
  <polyline points="4,6 15,14 26,6" stroke="#00D4FF" stroke-width="1.2" fill="none" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="34" y="22" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#DDE8F0" letter-spacing="-0.02em">Mail</text>
  <text x="70" y="22" font-family="system-ui, sans-serif" font-size="17" font-weight="300" fill="#00D4FF" letter-spacing="-0.02em">Flow</text>
</svg>
