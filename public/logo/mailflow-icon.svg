<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Background rounded rect -->
  <rect x="0" y="0" width="80" height="80" rx="16" fill="#00D4FF"/>

  <!-- Envelope -->
  <rect x="18" y="24" width="44" height="30" rx="4" stroke="white" stroke-width="2" fill="white" fill-opacity="0.15"/>
  <!-- Envelope flap -->
  <polyline points="18,24 40,39 62,24" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Flow lines below envelope -->
  <line x1="18" y1="60" x2="40" y2="60" stroke="white" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="66" x2="32" y2="66" stroke="white" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round"/>
</svg>
